name: ci
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    branches:
      - main
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  internal-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check lockfiles for internal package feed URLs
        shell: bash
        run: |
          if git grep -nE '(pkgs\.visualstudio\.com|pkgs\.dev\.azure\.com|packagefeedproxy\.microsoft\.io)' -- \
              '*pnpm-lock.yaml' '*package-lock.json' '*npm-shrinkwrap.json'; then
            echo "::error::A lockfile contains internal package feed URLs. Replace them with public registry URLs."
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          fi
      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          node-version-file: '.nvmrc'
          require-lockfile: true
      - name: Check new locked packages are at least 7 days old
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node script/check-package-release-age.ts --diff "$BASE_REF"

  agentic-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up gh-aw
        uses: github/gh-aw-actions/setup-cli@406c7719e31d7fe354224d4bb8fe3d4aeb47da1c # v1.2.1
        with:
          version: v1.0.1
      - name: check agentic workflows
        run: |
          gh aw compile --validate

          changes="$(git status --short --untracked-files=all -- \
            .gitattributes \
            .github/aw \
            .github/dependabot.yml \
            '.github/workflows/*.lock.yml' \
            .github/workflows/agentics-maintenance.yml)"

          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git --no-pager diff -- \
              .gitattributes \
              .github/aw \
              .github/dependabot.yml \
              '.github/workflows/*.lock.yml' \
              .github/workflows/agentics-maintenance.yml
            printf '%s\n' "::error::Agentic workflow files are out of date. Run 'gh aw compile' and commit the changes."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          node-version-file: '.nvmrc'
          require-lockfile: true
      - name: restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-
      - name: Build project
        run: pnpm run build

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          node-version-file: '.nvmrc'
          require-lockfile: true
      - name: Check for unformatted files
        run: pnpm run format:diff

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          node-version-file: '.nvmrc'
          require-lockfile: true
      - name: restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-
      - name: Lint JavaScript
        run: pnpm exec turbo run lint
      - name: Lint npm packages
        run: pnpm exec turbo run lint:npm

  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          node-version-file: '.nvmrc'
          require-lockfile: true
      - name: Run tests
        run: pnpm exec turbo run test -- --run

  test-e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          node-version-file: '.nvmrc'
          require-lockfile: true
      - name: restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-
      - name: Build @primer/agent-eval package
        run: pnpm exec turbo run --filter '@primer/agent-eval' build
      - name: Run e2e tests
        run: pnpm run -r test:e2e

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          node-version-file: '.nvmrc'
          require-lockfile: true
      - name: restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-
      - name: Type check
        run: pnpm exec turbo run type-check
