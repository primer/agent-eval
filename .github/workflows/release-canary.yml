name: Release canary

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - name: Create canary snapshot
        id: canary
        run: |
          snapshot_date="$(date -u +%Y%m%d)"
          pnpm changeset version \
            --snapshot canary \
            --snapshot-prerelease-template "{tag}-{commit-short}-$snapshot_date"
          version="$(node -p "require('./packages/agent-eval/package.json').version")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build and check package
        run: pnpm exec turbo run build lint:npm --filter=@primer/agent-eval
      - name: Publish canary and create GitHub prerelease
        id: release
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm changeset publish --tag canary
          create-github-releases: true
          push-git-tags: true
      - name: Summarize canary release
        env:
          PUBLISHED: ${{ steps.release.outputs.published }}
          VERSION: ${{ steps.canary.outputs.version }}
        run: |
          if [[ "$PUBLISHED" != "true" ]]; then
            echo "::error::No canary was published. This commit may already have a canary for today."
            exit 1
          fi

          {
            printf '## Canary release\n\n'
            printf 'GitHub prerelease: %s/%s/releases/tag/@primer/agent-eval@%s\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION"
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Install this version:\n\n```sh\nnpm install @primer/agent-eval@%s\n```\n\n' "$VERSION"
            printf 'Or install the latest canary:\n\n```sh\nnpm install @primer/agent-eval@canary\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
