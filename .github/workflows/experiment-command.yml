name: experiment command

on:
  issue_comment:
    types:
      - created

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  experiment:
    if: ${{ github.event.issue.pull_request != null }}
    runs-on: ubuntu-latest
    steps:
      - name: Check command
        id: command
        uses: github/command@v2.0.0
        with:
          command: '.experiment run'
          allowed_contexts: pull_request
          permissions: write,admin
          allow_forks: 'false'

      - name: Parse experiment name
        id: parse
        if: ${{ steps.command.outputs.continue == 'true' && steps.command.outputs.fork != 'true' }}
        env:
          COMMENT_BODY: ${{ steps.command.outputs.comment_body }}
        run: |
          experiment_name=$(node --input-type=module <<'EOF'
          const body = process.env.COMMENT_BODY ?? ''
          const match = body.match(/^\s*\.experiment\s+run\s+([A-Za-z0-9._-]+)\s*$/m)
          if (!match) {
            process.exit(1)
          }
          console.log(match[1])
          EOF
          )

          artifact_name=$(node --input-type=module "$experiment_name" <<'EOF'
          const experimentName = process.argv[1]
          console.log(`agent-eval-${experimentName}`.replace(/[^A-Za-z0-9_.-]/g, '-'))
          EOF
          )

          echo "experiment=$experiment_name" >> "$GITHUB_OUTPUT"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: ${{ steps.parse.outputs.experiment != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.command.outputs.sha }}

      - name: Set up pnpm
        if: ${{ steps.parse.outputs.experiment != '' }}
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        if: ${{ steps.parse.outputs.experiment != '' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: ${{ steps.parse.outputs.experiment != '' }}
        run: pnpm install --frozen-lockfile

      - name: Build project
        if: ${{ steps.parse.outputs.experiment != '' }}
        run: pnpm run build

      - name: Run experiment
        id: run
        if: ${{ steps.parse.outputs.experiment != '' }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          EXPERIMENT_NAME: ${{ steps.parse.outputs.experiment }}
        run: |
          set -o pipefail
          node packages/agent-eval/dist/cli.js \
            --experiment "$EXPERIMENT_NAME" \
            --artifacts artifacts \
            2>&1 | tee agent-eval.log

          jq --exit-status 'length > 0' results.json >/dev/null
          awk '/^Experiment  +Treatment  +Eval  +Model  +Success Rate/ {capture = 1} capture {print}' agent-eval.log > agent-eval-table.txt

      - name: Upload experiment results
        id: upload
        if: ${{ always() && steps.parse.outputs.experiment != '' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ steps.parse.outputs.artifact-name }}
          path: |
            results.json
            artifacts
            agent-eval.log
            agent-eval-table.txt
          if-no-files-found: ignore

      - name: Comment with experiment results
        if: ${{ always() && steps.parse.outputs.experiment != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPERIMENT_NAME: ${{ steps.parse.outputs.experiment }}
          ISSUE_NUMBER: ${{ steps.command.outputs.issue_number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### agent-eval experiment: \`$EXPERIMENT_NAME\`"
            echo
            if [ -s agent-eval-table.txt ]; then
              echo '```'
              cat agent-eval-table.txt
              echo '```'
              echo
            else
              echo "The experiment did not produce a results table. See the workflow logs for details."
              echo
            fi

            if [ -n "$ARTIFACT_URL" ]; then
              echo "[Download experiment artifact]($ARTIFACT_URL) containing \`results.json\` and the \`artifacts/\` directory."
            else
              echo "[View workflow run]($RUN_URL)."
            fi
          } > comment.md

          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --field body=@comment.md
