name: baseline
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-baseline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      run-date: ${{ steps.run.outputs.date }}
    steps:
      - name: set run date
        id: run
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  run:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        order: [1, 2, 3, 4]
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: build project
        run: pnpm run build
      - name: run baseline
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          OUTPUT_FILE: output-${{ matrix.order }}.json
          RUN_DATE: ${{ needs.setup.outputs.run-date }}
          SHARD: ${{ matrix.order }}/${{ strategy.job-total }}
        run: scripts/run-baseline.sh
      - name: upload baseline results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-${{ github.run_id }}-${{ matrix.order }}
          path: |
            results
            artifacts
          if-no-files-found: ignore

  publish:
    needs: [setup, run]
    runs-on: ubuntu-latest
    steps:
      - name: create github app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PRIMER_APP_ID_SHARED }}
          private-key: ${{ secrets.PRIMER_APP_PRIVATE_KEY_SHARED }}
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}
      - name: download baseline results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: baseline-${{ github.run_id }}-*
          merge-multiple: true
      - name: merge baseline results
        env:
          RUN_DATE: ${{ needs.setup.outputs.run-date }}
        run: |
          jq --slurp \
            '.[0] + {treatments: [.[].treatments[]], results: [.[].results[]]}' \
            results/"$RUN_DATE"/output-*.json > results/"$RUN_DATE"/output.json
          rm results/"$RUN_DATE"/output-*.json
      - name: open baseline results pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_DATE: ${{ needs.setup.outputs.run-date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            exit 0
          fi
          branch="chore/baseline-$RUN_DATE"
          git checkout -b "$branch"
          git commit -m "chore: record baseline results for $RUN_DATE"
          git push origin "$branch"
          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$branch" \
            --title "chore: record baseline results for $RUN_DATE" \
            --body "Automated weekly baseline results for $RUN_DATE."
