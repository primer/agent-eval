name: experiment
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment name to run
        required: true
        type: string
      concurrency:
        description: Number of treatments to run in parallel
        required: false
        default: '1'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.experiment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build project
        run: pnpm run build
      - name: Run experiment
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          CONCURRENCY: ${{ inputs.concurrency }}
          EXPERIMENT_NAME: ${{ inputs.experiment }}
        run: |
          set -o pipefail
          node packages/agent-eval/dist/cli.js \
            --concurrency "$CONCURRENCY" \
            --experiment "$EXPERIMENT_NAME" \
            --experiments experiments/src \
            --artifacts artifacts
      - name: Upload experiment results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: experiment
          path: |
            results.json
            artifacts
          if-no-files-found: ignore
