name: experiment
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment name to run
        required: true
        type: string
      concurrency:
        description: Number of treatments to run in parallel
        required: false
        default: '1'
        type: string
      docker-image:
        description: >-
          Docker container image to use for running treatments.
          Must be a Debian-based Node image with apt-get and a node user (e.g. node:26.5.0-slim).
        required: false
        default: 'node:26.5.0-slim'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.experiment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        order: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build project
        run: pnpm run build
      - name: Run experiment
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DOCKER_IMAGE: ${{ inputs.docker-image || 'node:26.5.0-slim' }}
          EXPERIMENT_NAME: ${{ inputs.experiment }}
          OUTPUT_FILE: output-${{ matrix.order }}.json
          SHARD: ${{ matrix.order }}/${{ strategy.job-total }}
        run: |
          set -o pipefail
          node packages/agent-eval/dist/cli.js \
            --concurrency "$CONCURRENCY" \
            --docker-image "$DOCKER_IMAGE" \
            --experiment "$EXPERIMENT_NAME" \
            --experiments experiments \
            --scenarios scenarios \
            --artifacts artifacts \
            --output "$OUTPUT_FILE" \
            --shard "$SHARD"
      - name: Upload experiment results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experiment-shard-${{ github.run_id }}-${{ matrix.order }}
          path: |
            output-${{ matrix.order }}.json
            artifacts
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  merge:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - name: download experiment results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: experiment-shard-${{ github.run_id }}-*
          merge-multiple: true
      - name: merge experiment results
        run: |
          jq --slurp '
            . as $outputs
            | ([$outputs[].treatments[]] | unique_by(.config.name)) as $treatments
            | $outputs[0]
            | .treatments = $treatments
            | .results = [
                $outputs[] as $output
                | $output.results[]
                | . as $result
                | ($output.treatments[] | select(.id == $result.treatmentId).config.name) as $name
                | .treatmentId = ($treatments[] | select(.config.name == $name).id)
              ]
          ' output-*.json > output.json
          rm output-*.json
      - name: upload experiment results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experiment
          path: |
            output.json
            artifacts
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
