name: Release canary

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - name: Create canary snapshot
        run: |
          snapshot_date="$(date -u +%Y%m%d)"
          pnpm changeset version \
            --snapshot canary \
            --snapshot-prerelease-template "{tag}-{commit-short}-$snapshot_date"
      - name: Prepare canary release notes
        id: canary
        run: |
          version="$(node -p "require('./packages/agent-eval/package.json').version")"
          {
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Install this version:\n\n```sh\nnpm install @primer/agent-eval@%s\n```\n' "$version"
            bash script/release-canary-notes.sh "$version"
          } > "$RUNNER_TEMP/canary-release-notes.md"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build and check package
        run: pnpm exec turbo run build lint:npm --filter=@primer/agent-eval
      - name: Publish canary to npm
        run: pnpm changeset publish --tag canary --no-git-tag
      - name: Create GitHub prerelease and tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.canary.outputs.version }}
        run: |
          release_url="$(gh release create "@primer/agent-eval@$VERSION" \
            --target "$GITHUB_SHA" \
            --title "@primer/agent-eval@$VERSION" \
            --prerelease \
            --latest=false \
            --notes-file "$RUNNER_TEMP/canary-release-notes.md")"
          printf 'url=%s\n' "$release_url" >> "$GITHUB_OUTPUT"
      - name: Summarize canary release
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          {
            printf '## Canary release\n\n'
            printf 'GitHub prerelease: %s\n\n' "$RELEASE_URL"
            cat "$RUNNER_TEMP/canary-release-notes.md"
            printf '\nOr install the latest canary:\n\n```sh\nnpm install @primer/agent-eval@canary\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
