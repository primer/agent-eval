name: experiment
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment name to run
        required: true
        type: string
      concurrency:
        description: Number of treatments to run in parallel
        required: false
        default: '1'
        type: string
      docker-image:
        description: >-
          Docker container image to use for running treatments.
          Must be a Debian-based Node image with apt-get and a node user (e.g. node:26-slim).
        required: false
        default: 'node:26-slim'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.experiment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build project
        run: pnpm run build
      - name: Run experiment
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DOCKER_IMAGE: ${{ inputs.docker-image || 'node:26-slim' }}
          EXPERIMENT_NAME: ${{ inputs.experiment }}
        run: |
          set -o pipefail
          node packages/agent-eval/dist/cli.js \
            --concurrency "$CONCURRENCY" \
            --docker-image "$DOCKER_IMAGE" \
            --experiment "$EXPERIMENT_NAME" \
            --experiments experiments \
            --scenarios scenarios \
            --artifacts artifacts
      - name: Upload experiment results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: experiment
          path: |
            results.json
            artifacts
          if-no-files-found: ignore
