name: experiment
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment name to run
        required: true
        type: string
      concurrency:
        description: Number of treatments to run in parallel
        required: false
        default: '1'
        type: string
      docker-image:
        description: >-
          Docker base image to layer the treatment environment on.
          Must be a Debian-based Node image with npm, apt-get, and a node user.
        required: false
        default: 'node:26.5.0-slim'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.experiment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          require-lockfile: true
      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: build project
        run: pnpm run build
      - name: run experiment
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DOCKER_IMAGE: ${{ inputs.docker-image || 'node:26.5.0-slim' }}
        run: script/run-experiment.sh "${{ inputs.experiment }}"
      - name: prepare experiment artifact
        if: ${{ always() }}
        run: |
          mkdir -p workflow-artifact
          if [[ -d results ]]; then
            mv results workflow-artifact/results
          fi
      - name: upload experiment results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experiment-${{ github.run_id }}
          path: workflow-artifact
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
