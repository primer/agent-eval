name: baseline
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-baseline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      run-date: ${{ steps.run.outputs.date }}
    steps:
      - name: set run date
        id: run
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  run:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        order: [1, 2, 3, 4]
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: build project
        run: pnpm run build
      - name: run baseline
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          OUTPUT_FILE: output-${{ matrix.order }}.json
          RUN_DATE: ${{ needs.setup.outputs.run-date }}
          SHARD: ${{ matrix.order }}/${{ strategy.job-total }}
        run: scripts/run-baseline.sh
      - name: upload baseline results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-${{ github.run_id }}-${{ matrix.order }}
          path: |
            results
            artifacts
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
