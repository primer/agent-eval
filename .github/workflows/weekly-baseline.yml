name: weekly baseline
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-baseline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: build project
        run: pnpm run build
      - name: set run date
        id: run
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: run baseline
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          RUN_DATE: ${{ steps.run.outputs.date }}
        run: scripts/run-baseline.sh
      - name: upload baseline results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: baseline-${{ github.run_id }}
          path: |
            results
            artifacts
          if-no-files-found: ignore
      - name: commit baseline results
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          RUN_DATE: ${{ steps.run.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record baseline results for $RUN_DATE"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
