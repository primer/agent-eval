name: retry evaluation
on:
  workflow_dispatch:
    inputs:
      type:
        description: Evaluation type to repair
        required: true
        type: choice
        options:
          - benchmark
          - experiment
      run-id:
        description: Workflow run ID containing the merged results to repair
        required: true
        type: string
      copilot-concurrency:
        description: Maximum number of Copilot sessions to run in parallel
        required: false
        default: '2'
        type: string
      container-concurrency:
        description: Maximum number of trial containers to run in parallel
        required: false
        default: '2'
        type: string

concurrency:
  group: retry-evaluation-${{ inputs.type }}-${{ inputs.run-id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: checkout retry tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - name: set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: build retry tooling
        run: pnpm exec turbo run build --filter=@primer/agent-eval
      - name: download evaluation results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.type }}-${{ inputs.run-id }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
      - name: resolve evaluation source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run-id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "run-id must be a numeric workflow run ID" >&2
            exit 1
          fi
          if [[ -f evaluation-source-revision.txt ]]; then
            revision="$(cat evaluation-source-revision.txt)"
          else
            revision="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)"
          fi
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid evaluation source revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$revision" > evaluation-source-revision.txt
      - name: checkout evaluation definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          path: evaluation-source
          persist-credentials: false
      - name: retry failed trials
        env:
          EVALUATION_TYPE: ${{ inputs.type }}
          COPILOT_CONCURRENCY: ${{ inputs.copilot-concurrency }}
          CONTAINER_CONCURRENCY: ${{ inputs.container-concurrency }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: bash script/retry-evaluation.sh "$EVALUATION_TYPE" "$GITHUB_WORKSPACE/evaluation-source"
      - name: prepare repaired artifact
        if: ${{ always() && steps.source.outcome == 'success' }}
        run: |
          mkdir -p workflow-artifact
          mv results workflow-artifact/results
          mv evaluation-source-revision.txt workflow-artifact/evaluation-source-revision.txt
      - name: upload repaired evaluation
        if: ${{ always() && steps.source.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.type }}-${{ github.run_id }}
          path: workflow-artifact
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
